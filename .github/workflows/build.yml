name: build

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # The DSP core has no dependencies, so it is checked on every push as a fast
  # gate before the slow plugin builds start.
  dsp:
    name: DSP core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the offline renderer
        run: |
          cmake -B build -DBLACKBOX_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target bb_render --config Release
          ./build/bb_render dsp-check.wav
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-render
          path: dsp-check.wav

  windows:
    name: Windows VST3 + Standalone
    runs-on: windows-latest
    needs: dsp
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/BLACKBOX_artefacts/Release/VST3/BLACKBOX.vst3 dist/
          cp -r build/BLACKBOX_artefacts/Release/Standalone/BLACKBOX.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-windows
          path: dist/

  linux:
    name: Linux standalone (dev loop)
    runs-on: ubuntu-latest
    needs: dsp
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev pkg-config
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
