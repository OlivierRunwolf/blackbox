name: build

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # The DSP core has no dependencies, so it is checked on every push as a fast
  # gate before the slow plugin builds start.
  dsp:
    name: DSP core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the offline renderer
        run: |
          cmake -B build -DBLACKBOX_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target bb_render --config Release
          ./build/bb_render dsp-check.wav
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-render
          path: dsp-check.wav

  windows:
    name: Windows VST3 + Standalone
    runs-on: windows-latest
    needs: dsp
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # Deliberately no -G: pinning a Visual Studio version breaks whenever
        # the runner image rolls forward. CMake picks whichever VS is present.
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Locate the outputs rather than assuming a layout, so a generator
          # change cannot silently produce an empty artifact.
          vst3=$(find build -name 'BLACKBOX.vst3' -print -quit)
          exe=$(find build -name 'BLACKBOX.exe' -print -quit)
          echo "vst3=$vst3"
          echo "exe=$exe"
          [ -n "$vst3" ] || { echo "::error::BLACKBOX.vst3 not found"; exit 1; }
          [ -n "$exe" ]  || { echo "::error::BLACKBOX.exe not found";  exit 1; }
          cp -r "$vst3" dist/
          cp -r "$exe"  dist/
      - uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-windows
          path: dist/

  linux:
    name: Linux standalone (dev loop)
    runs-on: ubuntu-latest
    needs: dsp
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev pkg-config
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
